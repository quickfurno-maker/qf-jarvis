apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: qfj-phase19
resources:
  - ../../base
  - artifact-check-jobs.yaml
generatorOptions:
  disableNameSuffixHash: true
secretGenerator:
  - name: jarvis-os-config
    files:
      - auth.json=fixtures/auth.json
patches:
  - target:
      kind: Deployment
      name: jarvis-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
  - target:
      kind: Deployment
      name: jarvis-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
