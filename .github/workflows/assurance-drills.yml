name: Assurance drills

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches: [main]
    paths:
      - 'packages/model-gateway/**'
      - 'packages/knowledge-index/**'
      - 'packages/postgres-knowledge-index/**'
      - 'packages/model-evaluation/**'
      - 'packages/model-intelligence-control/**'
      - 'packages/semantic-context-engine/**'
      - 'packages/multimodal-turn-planning/**'
      - 'packages/governed-agent-handoff/**'
      - 'packages/digital-twin-simulation/**'
      - 'apps/quickfurno-gateway/**'
      - 'apps/api/src/quickfurno-whatsapp/**'
      - 'apps/api/src/tests/jf5b-**'
      - 'apps/api/src/tests/credential-containment.test.ts'
      - '.github/workflows/assurance-drills.yml'

permissions:
  contents: read

concurrency:
  group: assurance-drills-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resilience:
    name: Resilience drill
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: qf_jarvis_test
          POSTGRES_USER: qf_jarvis_ci
          POSTGRES_PASSWORD: qf_jarvis_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qf_jarvis_ci -d qf_jarvis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://qf_jarvis_ci:qf_jarvis_ci_only@127.0.0.1:5432/qf_jarvis_test
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Exercise provider, queue and worker failure paths
        run: >-
          pnpm exec vitest run
          packages/model-gateway/src/tests/gateway.test.ts
          apps/quickfurno-gateway/src/tests/durable-turn-spool.test.ts
          apps/api/src/tests/quickfurno-whatsapp-production-worker.test.ts
      - name: Exercise pgvector release, rollback and failure paths
        run: >-
          pnpm exec vitest run --config vitest.integration.config.mjs
          packages/postgres-knowledge-index/src/tests/hybrid-index.integration.test.ts

  security-red-team:
    name: Security red-team regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build workspace packages
        run: pnpm build
      - name: Run prompt injection, authority, citation, secret and scope regressions
        run: >-
          pnpm exec vitest run
          packages/model-evaluation/src/tests/red-team-evidence.test.ts
          packages/knowledge-index/src/tests/hybrid.test.ts
          packages/model-intelligence-control/src/tests
          packages/semantic-context-engine/src/tests
          packages/multimodal-turn-planning/src/tests
          packages/governed-agent-handoff/src/tests
          packages/digital-twin-simulation/src/tests
          packages/jarvis-runtime/src/tests/fail-closed.test.ts
          packages/jarvis-runtime/src/tests/jf4-three-agent-rag.test.ts
          apps/api/src/tests/jf4-shared-retrieval-port.test.ts
          apps/api/src/tests/jf5b-certification-runner.test.ts
          apps/api/src/tests/jf5b-forbidden-claim-matcher.test.ts
          apps/api/src/tests/jf5b-claim-excerpt.test.ts
          apps/api/src/tests/credential-containment.test.ts
          apps/api/src/tests/shadow-containment.test.ts
