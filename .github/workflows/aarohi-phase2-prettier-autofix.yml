name: Aarohi Phase2 Prettier Autofix

on:
  push:
    branches: [feat/aarohi-phase2-autonomous-acquisition]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: feat/aarohi-phase2-autonomous-acquisition
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format Phase 2 files
        run: |
          pnpm exec prettier --write \
            apps/api/package.json \
            apps/api/src/aarohi-phase2/config.ts \
            apps/api/src/aarohi-phase2/core-client.ts \
            apps/api/src/aarohi-phase2/http-json-provider.test.ts \
            apps/api/src/aarohi-phase2/http-json-provider.ts \
            apps/api/src/aarohi-phase2/http-json-social-provider.ts \
            apps/api/src/aarohi-phase2/provider-port.ts \
            apps/api/src/aarohi-phase2/social-provider-port.ts \
            apps/api/src/aarohi-phase2/worker.test.ts \
            apps/api/src/aarohi-phase2/worker.ts \
            apps/api/src/bin/run-aarohi-phase2-worker.ts
          rm .github/workflows/aarohi-phase2-prettier-autofix.yml
      - name: Commit exact formatting
        run: |
          git config user.name "quickfurno-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "style(aarohi): normalize Phase 2 worker formatting"
          git push origin HEAD:feat/aarohi-phase2-autonomous-acquisition
