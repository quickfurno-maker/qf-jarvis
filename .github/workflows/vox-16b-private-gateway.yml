name: VOX-16B Jarvis gated advisory gateway
on:
  pull_request:
    paths:
      - 'contracts/vox/scopedAgentHttp.mjs'
      - 'scripts/vox/validate-vox-16b-gated-http.mjs'
      - 'apps/quickfurno-gateway/src/server.ts'
      - '.github/workflows/vox-16b-private-gateway.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24.18.0' }
      - run: |
          node scripts/vox/validate-vox-14-scoped-agent.mjs
          node scripts/vox/validate-vox-14-core-callback.mjs
          node scripts/vox/validate-vox-16b-gated-http.mjs
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter @qf-jarvis/quickfurno-gateway typecheck
