name: VOX-16C Jarvis staging reader wiring
on:
  pull_request:
    paths:
      - 'apps/quickfurno-gateway/src/index.ts'
      - 'contracts/vox/*.d.mts'
      - 'scripts/vox/validate-vox-16c-runtime-wiring.mjs'
      - '.github/workflows/vox-16c-runtime-wiring.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  runtime-staging:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24.18.0' }
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          node scripts/vox/validate-vox-16c-runtime-wiring.mjs
          node scripts/vox/validate-vox-14-core-callback.mjs
          pnpm --filter @qf-jarvis/quickfurno-gateway typecheck
