name: VOX-F1 Riya Signed Durable Pause Source QA (NO SEND)
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaF1*'
      - 'docs/vox/VOX-F1-RIYA-PRIVATE-PAUSE-SOURCE.md'
      - '.github/workflows/vox-f1-riya-signed-pause.yml'
permissions:
  contents: read
jobs:
  genuine-ed25519-http-local-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node --test contracts/vox/riyaF1SignedDurablePause.test.mjs contracts/vox/riyaF1PauseHttpHandler.test.mjs
      - run: pwsh -NoProfile -File contracts/vox/test-riyaF1AtomicPauseCandidate.ps1
