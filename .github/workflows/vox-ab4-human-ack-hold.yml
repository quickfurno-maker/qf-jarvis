name: VOX AB4 Agent Independent Internal ACK - RELEASE HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/ab4HumanCaseAcknowledgement*'
      - '.github/workflows/vox-ab4-human-ack-hold.yml'
permissions:
  contents: read
jobs:
  jarvis:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter '@qf-jarvis/quickfurno-gateway...' run build
      - run: node --test contracts/vox/*.test.mjs
      - run: pnpm exec vitest run apps/quickfurno-gateway/src/tests/vox-ui04-private-riya-mount.test.ts apps/quickfurno-gateway/src/tests/vox-private-http.test.ts apps/quickfurno-gateway/src/tests/vox-signed-private-http.test.ts
