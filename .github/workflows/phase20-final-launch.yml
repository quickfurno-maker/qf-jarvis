name: Phase 20 Final Scale Launch Certification

on:
  pull_request:
    paths:
      - 'contracts/qfj-phase20-final-launch-v1.json'
      - 'docs/scale/phase-20-final-launch-certification.md'
      - 'scripts/scale/validate-phase20-final-launch.mjs'
      - 'scripts/scale/certify-phase20-expand-contract-postgres.mjs'
      - 'scripts/scale/certify-db-connection-budget-postgres.mjs'
      - '.github/workflows/phase20-final-launch.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/qfj-phase20-final-launch-v1.json'
      - 'docs/scale/phase-20-final-launch-certification.md'
      - 'scripts/scale/validate-phase20-final-launch.mjs'
      - 'scripts/scale/certify-phase20-expand-contract-postgres.mjs'
      - 'scripts/scale/certify-db-connection-budget-postgres.mjs'
      - '.github/workflows/phase20-final-launch.yml'

permissions:
  contents: read

concurrency:
  group: phase20-final-launch-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-trixie@sha256:724a4041afdb1750446e3f6b5cfa8f3b0ac5a2cf538ddfa6bfee4f94c2fa85c6
        env:
          POSTGRES_DB: qf_jarvis_phase20
          POSTGRES_USER: qf_jarvis_phase20
          POSTGRES_PASSWORD: qf_jarvis_phase20_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qf_jarvis_phase20 -d qf_jarvis_phase20"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://qf_jarvis_phase20:qf_jarvis_phase20_ci_only@127.0.0.1:5432/qf_jarvis_phase20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate final launch contract
        run: node scripts/scale/validate-phase20-final-launch.mjs
      - name: Revalidate prior final gates
        run: |
          node scripts/scale/validate-phase17-dr.mjs
          node scripts/scale/validate-phase18-load-chaos.mjs
          node scripts/scale/validate-phase19-kubernetes.mjs
      - name: Rehearse expand backfill compatibility and contract
        run: node scripts/scale/certify-phase20-expand-contract-postgres.mjs
      - name: Re-certify 16-connection application budget
        run: node scripts/scale/certify-db-connection-budget-postgres.mjs
      - name: Verify clean tree
        run: git diff --check && test -z "$(git status --porcelain)"
