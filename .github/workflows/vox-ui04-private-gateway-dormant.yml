name: VOX UI-04 Dormant Jarvis Private HTTP (Release HOLD)
on:
  pull_request:
    paths:
      - 'apps/quickfurno-gateway/src/server.ts'
      - 'apps/quickfurno-gateway/src/tests/vox-ui04-private-riya-mount.test.ts'
      - '.github/workflows/vox-ui04-private-gateway-dormant.yml'
permissions:
  contents: read
jobs:
  real-loopback-http-default-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter '@qf-jarvis/quickfurno-gateway...' run build
      - run: pnpm exec vitest run apps/quickfurno-gateway/src/tests/vox-ui04-private-riya-mount.test.ts apps/quickfurno-gateway/src/tests/vox-private-http.test.ts
      - run: pnpm --filter @qf-jarvis/quickfurno-gateway typecheck:tests
