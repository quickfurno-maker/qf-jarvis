name: VOX Phase B Jarvis Signed Private Loopback - Release HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/phaseBRiyaGatewayLoopback.test.mjs'
      - '.github/workflows/vox-phaseB-signed-loopback.yml'
permissions:
  contents: read
jobs:
  signed-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter '@qf-jarvis/quickfurno-gateway...' run build
      - run: node --test contracts/vox/*.test.mjs
      - run: pnpm --filter @qf-jarvis/quickfurno-gateway typecheck:tests
