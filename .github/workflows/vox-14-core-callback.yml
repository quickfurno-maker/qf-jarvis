name: VOX-14 Jarvis Core authorization callback
on:
  pull_request:
    paths:
      - 'contracts/vox/**'
      - 'scripts/vox/**'
      - '.github/workflows/vox-14-core-callback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-core-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: { node-version: '24.18.0' }
      - run: |
          node scripts/vox/validate-vox-10c-composition.mjs
          node scripts/vox/validate-vox-14-scoped-agent.mjs
          node scripts/vox/validate-vox-14-core-callback.mjs
