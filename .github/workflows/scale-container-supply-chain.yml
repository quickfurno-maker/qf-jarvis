name: Scale Container Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scale-container-supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Build once and certify Jarvis images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve and verify source SHA
        id: source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(printf '%s' "$SOURCE_SHA" | wc -c)" -eq 40
          echo "sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Static artifact contract
        run: node scripts/scale/validate-artifact-contract.mjs

      - name: Build three exact release candidates once
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --build-arg GIT_SHA="$SOURCE_SHA" -f deploy/jarvis-os/Dockerfile -t "qfj-os-candidate:$SOURCE_SHA" .
          docker build --build-arg GIT_SHA="$SOURCE_SHA" -f deploy/quickfurno-gateway/Dockerfile -t "qfj-gateway-candidate:$SOURCE_SHA" .
          docker build --build-arg GIT_SHA="$SOURCE_SHA" -f deploy/quickfurno-worker/Dockerfile -t "qfj-worker-candidate:$SOURCE_SHA" .
          for IMAGE in qfj-os-candidate qfj-gateway-candidate qfj-worker-candidate; do
            docker image inspect "$IMAGE:$SOURCE_SHA" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' | grep -Fx "$SOURCE_SHA"
          done
          docker image inspect "qfj-os-candidate:$SOURCE_SHA" --format '{{.Id}}' > os-image-id.txt
          docker image inspect "qfj-gateway-candidate:$SOURCE_SHA" --format '{{.Id}}' > gateway-image-id.txt
          docker image inspect "qfj-worker-candidate:$SOURCE_SHA" --format '{{.Id}}' > worker-image-id.txt

      - name: Produce Jarvis OS HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-os-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-os.json

      - name: Enforce Jarvis OS vulnerability policy
        run: node scripts/scale/enforce-trivy-report.mjs trivy-os.json

      - name: Produce gateway HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-gateway-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-gateway.json

      - name: Enforce gateway vulnerability policy
        run: node scripts/scale/enforce-trivy-report.mjs trivy-gateway.json

      - name: Produce worker HIGH/CRITICAL vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-worker-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: json
          output: trivy-worker.json

      - name: Enforce worker vulnerability policy
        run: node scripts/scale/enforce-trivy-report.mjs trivy-worker.json

      - name: Generate Jarvis OS SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-os-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          format: spdx-json
          output: jarvis-os-sbom.spdx.json
          exit-code: '0'

      - name: Generate gateway SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-gateway-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          format: spdx-json
          output: jarvis-gateway-sbom.spdx.json
          exit-code: '0'

      - name: Generate worker SPDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: qfj-worker-candidate:${{ steps.source.outputs.sha }}
          scan-type: image
          format: spdx-json
          output: jarvis-worker-sbom.spdx.json
          exit-code: '0'

      - name: Package the exact certified images
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test -s jarvis-os-sbom.spdx.json
          test -s jarvis-gateway-sbom.spdx.json
          test -s jarvis-worker-sbom.spdx.json
          docker save             "qfj-os-candidate:$SOURCE_SHA"             "qfj-gateway-candidate:$SOURCE_SHA"             "qfj-worker-candidate:$SOURCE_SHA"             | gzip -1 > jarvis-images.tar.gz
          sha256sum             jarvis-images.tar.gz             jarvis-os-sbom.spdx.json             jarvis-gateway-sbom.spdx.json             jarvis-worker-sbom.spdx.json             os-image-id.txt gateway-image-id.txt worker-image-id.txt             > candidate.sha256

      - name: Upload immutable release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarvis-release-${{ steps.source.outputs.sha }}
          path: |
            jarvis-images.tar.gz
            jarvis-os-sbom.spdx.json
            jarvis-gateway-sbom.spdx.json
            jarvis-worker-sbom.spdx.json
            trivy-os.json
            trivy-gateway.json
            trivy-worker.json
            os-image-id.txt
            gateway-image-id.txt
            worker-image-id.txt
            candidate.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish and sign exact Jarvis digests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: certify
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download exact certified release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jarvis-release-${{ needs.certify.outputs.source_sha }}

      - name: Verify and load exact candidates
        env:
          SOURCE_SHA: ${{ needs.certify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c candidate.sha256
          gunzip -c jarvis-images.tar.gz | docker load
          test "$(docker image inspect "qfj-os-candidate:$SOURCE_SHA" --format '{{.Id}}')" = "$(cat os-image-id.txt)"
          test "$(docker image inspect "qfj-gateway-candidate:$SOURCE_SHA" --format '{{.Id}}')" = "$(cat gateway-image-id.txt)"
          test "$(docker image inspect "qfj-worker-candidate:$SOURCE_SHA" --format '{{.Id}}')" = "$(cat worker-image-id.txt)"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push exact source-SHA tags and resolve immutable digests
        id: publish
        env:
          SOURCE_SHA: ${{ needs.certify.outputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          OS_IMAGE="ghcr.io/quickfurno-maker/qf-jarvis-os"
          GATEWAY_IMAGE="ghcr.io/quickfurno-maker/qf-jarvis-gateway"
          WORKER_IMAGE="ghcr.io/quickfurno-maker/qf-jarvis-worker"
          docker tag "qfj-os-candidate:$SOURCE_SHA" "$OS_IMAGE:$SOURCE_SHA"
          docker tag "qfj-gateway-candidate:$SOURCE_SHA" "$GATEWAY_IMAGE:$SOURCE_SHA"
          docker tag "qfj-worker-candidate:$SOURCE_SHA" "$WORKER_IMAGE:$SOURCE_SHA"
          docker push "$OS_IMAGE:$SOURCE_SHA"
          docker push "$GATEWAY_IMAGE:$SOURCE_SHA"
          docker push "$WORKER_IMAGE:$SOURCE_SHA"
          docker pull "$OS_IMAGE:$SOURCE_SHA" >/dev/null
          docker pull "$GATEWAY_IMAGE:$SOURCE_SHA" >/dev/null
          docker pull "$WORKER_IMAGE:$SOURCE_SHA" >/dev/null
          OS_REF="$(docker image inspect "$OS_IMAGE:$SOURCE_SHA" --format '{{ index .RepoDigests 0 }}')"
          GATEWAY_REF="$(docker image inspect "$GATEWAY_IMAGE:$SOURCE_SHA" --format '{{ index .RepoDigests 0 }}')"
          WORKER_REF="$(docker image inspect "$WORKER_IMAGE:$SOURCE_SHA" --format '{{ index .RepoDigests 0 }}')"
          OS_DIGEST="${OS_REF#*@}"
          GATEWAY_DIGEST="${GATEWAY_REF#*@}"
          WORKER_DIGEST="${WORKER_REF#*@}"
          for DIGEST in "$OS_DIGEST" "$GATEWAY_DIGEST" "$WORKER_DIGEST"; do
            [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          done
          {
            echo "os_image=$OS_IMAGE"
            echo "os_digest=$OS_DIGEST"
            echo "gateway_image=$GATEWAY_IMAGE"
            echo "gateway_digest=$GATEWAY_DIGEST"
            echo "worker_image=$WORKER_IMAGE"
            echo "worker_digest=$WORKER_DIGEST"
          } >> "$GITHUB_OUTPUT"
          printf '%s@%s\n%s@%s\n%s@%s\n'             "$OS_IMAGE" "$OS_DIGEST"             "$GATEWAY_IMAGE" "$GATEWAY_DIGEST"             "$WORKER_IMAGE" "$WORKER_DIGEST"             > published-image-refs.txt

      - name: Install verified Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Sign all three digests and attach SBOM attestations
        env:
          OS_IMAGE: ${{ steps.publish.outputs.os_image }}
          OS_DIGEST: ${{ steps.publish.outputs.os_digest }}
          GATEWAY_IMAGE: ${{ steps.publish.outputs.gateway_image }}
          GATEWAY_DIGEST: ${{ steps.publish.outputs.gateway_digest }}
          WORKER_IMAGE: ${{ steps.publish.outputs.worker_image }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes "$OS_IMAGE@$OS_DIGEST"
          cosign sign --yes "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          cosign sign --yes "$WORKER_IMAGE@$WORKER_DIGEST"
          cosign attest --yes --type spdxjson --predicate jarvis-os-sbom.spdx.json "$OS_IMAGE@$OS_DIGEST"
          cosign attest --yes --type spdxjson --predicate jarvis-gateway-sbom.spdx.json "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          cosign attest --yes --type spdxjson --predicate jarvis-worker-sbom.spdx.json "$WORKER_IMAGE@$WORKER_DIGEST"

      - name: Attest Jarvis OS build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.os_image }}
          subject-digest: ${{ steps.publish.outputs.os_digest }}
          push-to-registry: true

      - name: Attest gateway build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.gateway_image }}
          subject-digest: ${{ steps.publish.outputs.gateway_digest }}
          push-to-registry: true

      - name: Attest worker build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.publish.outputs.worker_image }}
          subject-digest: ${{ steps.publish.outputs.worker_digest }}
          push-to-registry: true

      - name: Verify all published digest references are pullable
        env:
          OS_IMAGE: ${{ steps.publish.outputs.os_image }}
          OS_DIGEST: ${{ steps.publish.outputs.os_digest }}
          GATEWAY_IMAGE: ${{ steps.publish.outputs.gateway_image }}
          GATEWAY_DIGEST: ${{ steps.publish.outputs.gateway_digest }}
          WORKER_IMAGE: ${{ steps.publish.outputs.worker_image }}
          WORKER_DIGEST: ${{ steps.publish.outputs.worker_digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$OS_IMAGE@$OS_DIGEST"
          docker pull "$GATEWAY_IMAGE@$GATEWAY_DIGEST"
          docker pull "$WORKER_IMAGE@$WORKER_DIGEST"

      - name: Upload publication receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jarvis-published-${{ needs.certify.outputs.source_sha }}
          path: |
            published-image-refs.txt
            jarvis-os-sbom.spdx.json
            jarvis-gateway-sbom.spdx.json
            jarvis-worker-sbom.spdx.json
            candidate.sha256
          if-no-files-found: error
          retention-days: 30
