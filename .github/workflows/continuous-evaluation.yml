name: Continuous evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/riya-prompts/**'
      - 'packages/anisha-prompts/**'
      - 'packages/aarohi-prompts/**'
      - 'packages/riya-agent/**'
      - 'packages/anisha-agent/**'
      - 'packages/aarohi-agent/**'
      - 'packages/agent-runtime/**'
      - 'packages/jarvis-v1-production-profile/**'
      - 'packages/jarvis-v1-production-seal/**'
      - 'packages/jarvis-v1-provider-certification-live/**'
      - 'packages/model-gateway/**'
      - 'packages/model-evaluation/**'
      - 'packages/governed-knowledge/**'
      - 'packages/knowledge-index/**'
      - 'packages/knowledge-ingestion/**'
      - 'packages/postgres-knowledge-index/**'
      - 'packages/rag-provisioning/**'
      - 'packages/governed-memory-foundation/**'
      - 'packages/postgres-governed-memory-store/**'
      - 'packages/core-data-tools/**'
      - 'packages/knowledge-freshness/**'
      - 'packages/jao-action-registry/**'
      - 'packages/jarvis-runtime/**'
      - 'apps/api/src/jf6-private-process/create-core-data-tools.ts'
      - 'apps/api/src/jf6-private-process/create-riya-structured-action-boundary.ts'
      - 'apps/api/src/knowledge-freshness/**'
      - 'apps/api/src/runtime/durable-jarvis-runtime.ts'
      - 'apps/worker/src/jao/**'
      - 'apps/api/src/composition/jf5b-**'
      - 'apps/api/src/tests/jf5b-**'
      - 'apps/api/src/quickfurno-whatsapp/production-seal-binding.ts'
      - 'apps/api/src/quickfurno-whatsapp/production-worker-config.ts'
      - 'apps/api/src/tests/credential-containment.test.ts'
      - '.github/workflows/continuous-evaluation.yml'

permissions:
  contents: read

concurrency:
  group: continuous-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Continuous agent evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build

      - name: Run governed evaluation regression set
        run: >-
          pnpm exec vitest run
          packages/model-evaluation/src/tests
          packages/knowledge-index/src/tests/quality.test.ts
          packages/governed-memory-foundation/src/tests
          packages/postgres-governed-memory-store/src/tests
          packages/core-data-tools/src/tests
          packages/knowledge-freshness/src/tests
          packages/jao-action-registry/src/tests
          apps/api/src/tests/jf6-core-data-tools.test.ts
          apps/api/src/tests/jf6-riya-structured-action-boundary.test.ts
          apps/api/src/tests/governed-memory-runtime.test.ts
          apps/api/src/tests/knowledge-freshness-coordinator.test.ts
          apps/api/src/tests/knowledge-freshness-manifest-source.test.ts
          apps/worker/src/tests/jao-action-registry-binding.test.ts
          apps/worker/src/tests/jao-maturity-gate.test.ts
          packages/jarvis-runtime/src/tests/hybrid-grounding.test.ts
          packages/jarvis-runtime/src/tests/jf4-three-agent-rag.test.ts
          packages/jarvis-runtime/src/tests/fail-closed.test.ts
          apps/api/src/tests/jf4-shared-retrieval-port.test.ts
          apps/api/src/tests/jf5b-certification-runner.test.ts
          apps/api/src/tests/jf5b-forbidden-claim-matcher.test.ts
          apps/api/src/tests/credential-containment.test.ts
