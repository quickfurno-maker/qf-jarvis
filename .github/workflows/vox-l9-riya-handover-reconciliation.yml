name: VOX-L9 Jarvis Riya Evidence Reconciliation (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaHandoverEvidenceReconciliation*'
      - 'docs/vox/VOX-L9-*'
      - '.github/workflows/vox-l9-riya-handover-reconciliation.yml'
permissions:
  contents: read
jobs:
  signed-evidence-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: node --test contracts/vox/riyaReadOnlyHandoverObservation.test.mjs contracts/vox/riyaHandoverEvidenceReconciliation.test.mjs
