name: VOX-10B Jarvis Readonly Riya Observation (Release HOLD)
on:
  pull_request:
    paths:
      - 'contracts/vox/riyaReadOnlyHandoverObservation*'
      - 'docs/vox/VOX-10B-*'
      - '.github/workflows/vox-10b-jarvis-riya-observation.yml'
permissions:
  contents: read
jobs:
  signed-subject-shape-only:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: node --test contracts/vox/riyaReadOnlyHandoverObservation.test.mjs
