name: VOX AB2 Agent Human Handover - Source HOLD
on:
  pull_request:
    paths:
      - 'contracts/vox/ab2HumanHandoverGate.mjs'
      - 'contracts/vox/ab2HumanHandoverGate.test.mjs'
      - '.github/workflows/vox-ab2-agent-handover.yml'
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm --filter '@qf-jarvis/quickfurno-gateway...' run build
      - run: node --test contracts/vox/*.test.mjs
