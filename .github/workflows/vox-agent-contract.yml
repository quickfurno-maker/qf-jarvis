name: VOX Jarvis Contract Gates
on:
  pull_request:
    paths:
      - 'contracts/vox/**'
      - 'scripts/vox/**'
      - '.github/workflows/vox-agent-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.20.2'
      - run: node scripts/vox/validate-agent-view.mjs
