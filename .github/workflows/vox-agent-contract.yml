name: VOX Jarvis Contract Gates
on:
  pull_request:
    paths:
      - 'contracts/vox/**'
      - 'scripts/vox/**'
      - '.github/workflows/vox-agent-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '20.20.2'
      - run: node scripts/vox/validate-agent-view.mjs
