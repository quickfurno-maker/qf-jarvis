name: OCI Supply Chain

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/scale-*'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish, sign and attest this exact source head
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: qfj-oci-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  GHCR_OS_IMAGE: ghcr.io/${{ github.repository_owner }}/qf-jarvis-os
  GHCR_GATEWAY_IMAGE: ghcr.io/${{ github.repository_owner }}/qf-jarvis-gateway
  GHCR_WORKER_IMAGE: ghcr.io/${{ github.repository_owner }}/qf-jarvis-worker

jobs:
  build-certify:
    name: Build once, scan and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.config.outputs.publish }}
      source_sha: ${{ steps.identity.outputs.source_sha }}

    steps:
      - name: Checkout exact source head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Verify exact source identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          echo "source_sha=${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Resolve publish mode
        id: config
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PUBLISH: ${{ inputs.publish || false }}
        run: |
          set -euo pipefail
          PUBLISH=false
          if [[ "${EVENT_NAME}" == "push" && "${REF_NAME}" == "main" ]]; then
            PUBLISH=true
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" && "${MANUAL_PUBLISH}" == "true" ]]; then
            if [[ "${REF_NAME}" != "main" ]]; then
              echo "REFUSED: manual publish is allowed only from main" >&2
              exit 64
            fi
            PUBLISH=true
          fi
          echo "publish=${PUBLISH}" >> "$GITHUB_OUTPUT"

      - name: Supply-chain contract
        run: node scripts/scale/validate-supply-chain-contract.mjs

      - name: Build Jarvis OS once
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --build-arg "GIT_SHA=${SOURCE_SHA}" \
            -f deploy/jarvis-os/Dockerfile \
            -t "qfj-os-candidate:${SOURCE_SHA}" \
            .

      - name: Build gateway once
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --build-arg "GIT_SHA=${SOURCE_SHA}" \
            -f deploy/quickfurno-gateway/Dockerfile \
            -t "qfj-gateway-candidate:${SOURCE_SHA}" \
            .

      - name: Build shared worker once
        run: |
          set -euo pipefail
          docker buildx build \
            --load \
            --build-arg "GIT_SHA=${SOURCE_SHA}" \
            -f deploy/quickfurno-worker/Dockerfile \
            -t "qfj-worker-candidate:${SOURCE_SHA}" \
            .

      - name: Vulnerability gate — Jarvis OS
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-os-candidate:${{ env.SOURCE_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivy-version: v0.75.0

      - name: Vulnerability gate — gateway
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-gateway-candidate:${{ env.SOURCE_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivy-version: v0.75.0

      - name: Vulnerability gate — shared worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-worker-candidate:${{ env.SOURCE_SHA }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivy-version: v0.75.0

      - name: Generate Jarvis OS SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-os-candidate:${{ env.SOURCE_SHA }}
          format: cyclonedx
          output: qfj-os-sbom.cdx.json
          exit-code: '0'
          trivy-version: v0.75.0

      - name: Generate gateway SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-gateway-candidate:${{ env.SOURCE_SHA }}
          format: cyclonedx
          output: qfj-gateway-sbom.cdx.json
          exit-code: '0'
          trivy-version: v0.75.0

      - name: Generate worker SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: qfj-worker-candidate:${{ env.SOURCE_SHA }}
          format: cyclonedx
          output: qfj-worker-sbom.cdx.json
          exit-code: '0'
          trivy-version: v0.75.0

      - name: Verify revision labels and record metadata
        shell: bash
        run: |
          set -euo pipefail
          os_revision="$(docker image inspect "qfj-os-candidate:${SOURCE_SHA}" | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
          gateway_revision="$(docker image inspect "qfj-gateway-candidate:${SOURCE_SHA}" | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
          worker_revision="$(docker image inspect "qfj-worker-candidate:${SOURCE_SHA}" | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
          test "${os_revision}" = "${SOURCE_SHA}"
          test "${gateway_revision}" = "${SOURCE_SHA}"
          test "${worker_revision}" = "${SOURCE_SHA}"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg os_id "$(docker image inspect "qfj-os-candidate:${SOURCE_SHA}" | jq -r '.[0].Id')" \
            --arg gateway_id "$(docker image inspect "qfj-gateway-candidate:${SOURCE_SHA}" | jq -r '.[0].Id')" \
            --arg worker_id "$(docker image inspect "qfj-worker-candidate:${SOURCE_SHA}" | jq -r '.[0].Id')" \
            '{source_sha:$source_sha,os_image_id:$os_id,gateway_image_id:$gateway_id,worker_image_id:$worker_id}' \
            > qfj-build-metadata.json

      - name: Package exact certified images
        run: |
          set -euo pipefail
          docker save \
            "qfj-os-candidate:${SOURCE_SHA}" \
            "qfj-gateway-candidate:${SOURCE_SHA}" \
            "qfj-worker-candidate:${SOURCE_SHA}" \
            | zstd -T0 -8 -o qfj-images.tar.zst
          zstd -t qfj-images.tar.zst

      - name: Upload certified build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfj-oci-${{ steps.identity.outputs.source_sha }}
          path: |
            qfj-images.tar.zst
            qfj-os-sbom.cdx.json
            qfj-gateway-sbom.cdx.json
            qfj-worker-sbom.cdx.json
            qfj-build-metadata.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    name: Publish exact certified artifacts
    needs: build-certify
    if: needs.build-certify.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Download certified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qfj-oci-${{ needs.build-certify.outputs.source_sha }}

      - name: Load exact certified images
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
        run: |
          set -euo pipefail
          zstd -t qfj-images.tar.zst
          zstd -dc qfj-images.tar.zst | docker load
          for image in os gateway worker; do
            revision="$(docker image inspect "qfj-${image}-candidate:${SOURCE_SHA}" | jq -r '.[0].Config.Labels["org.opencontainers.image.revision"]')"
            test "${revision}" = "${SOURCE_SHA}"
          done

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push source-SHA tags and resolve immutable digests
        id: push
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
        run: |
          set -euo pipefail
          push_one() {
            local local_image="$1"
            local remote_image="$2"
            local prefix="$3"
            remote_image="$(printf '%s' "${remote_image}" | tr '[:upper:]' '[:lower:]')"
            local ref="${remote_image}:${SOURCE_SHA}"
            docker tag "${local_image}:${SOURCE_SHA}" "${ref}"
            local push_output
            push_output="$(docker push "${ref}" 2>&1)"
            printf '%s\n' "${push_output}"
            local digest
            digest="$(awk '/digest: sha256:/ {print $2}' <<< "${push_output}" | tail -n1)"
            [[ "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            {
              echo "${prefix}_image=${remote_image}"
              echo "${prefix}_digest=${digest}"
              echo "${prefix}_ref=${remote_image}@${digest}"
            } >> "$GITHUB_OUTPUT"
          }
          push_one "qfj-os-candidate" "${GHCR_OS_IMAGE}" "os"
          push_one "qfj-gateway-candidate" "${GHCR_GATEWAY_IMAGE}" "gateway"
          push_one "qfj-worker-candidate" "${GHCR_WORKER_IMAGE}" "worker"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Keyless-sign immutable image digests
        env:
          OS_REF: ${{ steps.push.outputs.os_ref }}
          GATEWAY_REF: ${{ steps.push.outputs.gateway_ref }}
          WORKER_REF: ${{ steps.push.outputs.worker_ref }}
        run: |
          set -euo pipefail
          cosign sign --yes "${OS_REF}"
          cosign sign --yes "${GATEWAY_REF}"
          cosign sign --yes "${WORKER_REF}"

      - name: Attest CycloneDX SBOMs
        env:
          OS_REF: ${{ steps.push.outputs.os_ref }}
          GATEWAY_REF: ${{ steps.push.outputs.gateway_ref }}
          WORKER_REF: ${{ steps.push.outputs.worker_ref }}
        run: |
          set -euo pipefail
          cosign attest --yes --type cyclonedx --predicate qfj-os-sbom.cdx.json "${OS_REF}"
          cosign attest --yes --type cyclonedx --predicate qfj-gateway-sbom.cdx.json "${GATEWAY_REF}"
          cosign attest --yes --type cyclonedx --predicate qfj-worker-sbom.cdx.json "${WORKER_REF}"

      - name: Attest Jarvis OS provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.os_image }}
          subject-digest: ${{ steps.push.outputs.os_digest }}
          push-to-registry: true

      - name: Attest gateway provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.gateway_image }}
          subject-digest: ${{ steps.push.outputs.gateway_digest }}
          push-to-registry: true

      - name: Attest worker provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.worker_image }}
          subject-digest: ${{ steps.push.outputs.worker_digest }}
          push-to-registry: true

      - name: Verify keyless signatures
        env:
          OS_REF: ${{ steps.push.outputs.os_ref }}
          GATEWAY_REF: ${{ steps.push.outputs.gateway_ref }}
          WORKER_REF: ${{ steps.push.outputs.worker_ref }}
        run: |
          set -euo pipefail
          IDENTITY="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/oci-supply-chain.yml@${GITHUB_REF}"
          for image_ref in "${OS_REF}" "${GATEWAY_REF}" "${WORKER_REF}"; do
            cosign verify \
              --certificate-identity="${IDENTITY}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${image_ref}" >/dev/null
            cosign verify-attestation \
              --type cyclonedx \
              --certificate-identity="${IDENTITY}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              "${image_ref}" >/dev/null
          done

      - name: Record release metadata
        env:
          SOURCE_SHA: ${{ needs.build-certify.outputs.source_sha }}
          OS_IMAGE: ${{ steps.push.outputs.os_image }}
          OS_DIGEST: ${{ steps.push.outputs.os_digest }}
          GATEWAY_IMAGE: ${{ steps.push.outputs.gateway_image }}
          GATEWAY_DIGEST: ${{ steps.push.outputs.gateway_digest }}
          WORKER_IMAGE: ${{ steps.push.outputs.worker_image }}
          WORKER_DIGEST: ${{ steps.push.outputs.worker_digest }}
        run: |
          set -euo pipefail
          OS_SBOM_SHA256="$(sha256sum qfj-os-sbom.cdx.json | awk '{print $1}')"
          GATEWAY_SBOM_SHA256="$(sha256sum qfj-gateway-sbom.cdx.json | awk '{print $1}')"
          WORKER_SBOM_SHA256="$(sha256sum qfj-worker-sbom.cdx.json | awk '{print $1}')"
          jq -n \
            --arg source_sha "${SOURCE_SHA}" \
            --arg os_ref "${OS_IMAGE}@${OS_DIGEST}" \
            --arg gateway_ref "${GATEWAY_IMAGE}@${GATEWAY_DIGEST}" \
            --arg worker_ref "${WORKER_IMAGE}@${WORKER_DIGEST}" \
            --arg os_sbom_sha256 "${OS_SBOM_SHA256}" \
            --arg gateway_sbom_sha256 "${GATEWAY_SBOM_SHA256}" \
            --arg worker_sbom_sha256 "${WORKER_SBOM_SHA256}" \
            '{source_sha:$source_sha,os_ref:$os_ref,gateway_ref:$gateway_ref,worker_ref:$worker_ref,os_sbom_sha256:$os_sbom_sha256,gateway_sbom_sha256:$gateway_sbom_sha256,worker_sbom_sha256:$worker_sbom_sha256}' \
            > qfj-release-metadata.json

      - name: Upload release metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qfj-oci-release-${{ needs.build-certify.outputs.source_sha }}
          path: |
            qfj-release-metadata.json
            qfj-os-sbom.cdx.json
            qfj-gateway-sbom.cdx.json
            qfj-worker-sbom.cdx.json
          if-no-files-found: error
          retention-days: 90
