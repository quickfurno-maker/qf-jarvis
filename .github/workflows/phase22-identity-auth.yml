name: Phase 22 Identity Auth Independence

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/qfj-phase22-identity-auth-v1.json"
      - "docs/scale/phase-22-identity-auth-provider-independence.md"
      - "scripts/scale/validate-phase22-identity-auth.mjs"
      - "package.json"
      - ".github/workflows/phase22-identity-auth.yml"
  push:
    branches: [main]
    paths:
      - "contracts/qfj-phase22-identity-auth-v1.json"
      - "docs/scale/phase-22-identity-auth-provider-independence.md"
      - "scripts/scale/validate-phase22-identity-auth.mjs"
      - "package.json"
      - ".github/workflows/phase22-identity-auth.yml"

permissions:
  contents: read

concurrency:
  group: phase22-identity-auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity-boundary-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24.18.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Phase 22 Jarvis identity boundary
        run: pnpm run check:scale:phase22
      - name: Revalidate Phase 21 boundary
        run: pnpm run check:scale:phase21
      - name: Revalidate Phase 20 boundary
        run: pnpm run check:scale:phase20
      - name: Verify working tree clean
        run: test -z "$(git status --porcelain)"
