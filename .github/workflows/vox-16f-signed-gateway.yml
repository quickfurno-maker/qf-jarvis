name: VOX-16F Jarvis Core-scoped Signed HTTP
on:
  pull_request:
    paths:
      - 'apps/quickfurno-gateway/src/tests/vox-signed-private-http.test.ts'
      - '.github/workflows/vox-16f-signed-gateway.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  core-scope-and-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with: {node-version: '24.18.0'}
      - run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm --filter '@qf-jarvis/quickfurno-gateway...' build
          pnpm exec vitest run apps/quickfurno-gateway/src/tests/vox-private-http.test.ts apps/quickfurno-gateway/src/tests/vox-signed-private-http.test.ts
          pnpm --filter @qf-jarvis/quickfurno-gateway typecheck
