name: Phase 1 AOS Shadow Production Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DIAGNOSE_AOS_SHADOW_PHASE1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qf-jarvis-phase1-aos-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production host privilege diagnostic
    environment: production
    runs-on: [self-hosted, Linux, X64, qfj-phase15-deployer]
    timeout-minutes: 5
    steps:
      - name: Enforce explicit diagnostic request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DIAGNOSE_AOS_SHADOW_PHASE1"

      - name: Inspect allowlisted sudo commands and installed controller identity
        shell: bash
        run: |
          set -euo pipefail
          echo "=== sudo allowlist ==="
          sudo -n -l
          echo "=== installed release controller ==="
          test -f /srv/qf-jarvis/release-control/deploy/phase15/release.sh
          stat -c 'release_control owner=%u:%g mode=%a size=%s mtime=%y' /srv/qf-jarvis/release-control/deploy/phase15/release.sh
          sha256sum /srv/qf-jarvis/release-control/deploy/phase15/release.sh
          echo "=== live repo candidate ==="
          test -f /srv/qf-jarvis/repo/deploy/phase15/release.sh
          stat -c 'repo_release owner=%u:%g mode=%a size=%s mtime=%y' /srv/qf-jarvis/repo/deploy/phase15/release.sh
          sha256sum /srv/qf-jarvis/repo/deploy/phase15/release.sh
