name: Phase 1 AOS Shadow Production Diagnostic

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DIAGNOSE_AOS_SHADOW_PHASE1'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: qf-jarvis-phase1-aos-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Read-only production AOS shadow diagnostic
    environment: production
    runs-on: [self-hosted, Linux, X64, qfj-phase15-deployer]
    timeout-minutes: 10
    steps:
      - name: Enforce explicit diagnostic request
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CONFIRMATION" = "DIAGNOSE_AOS_SHADOW_PHASE1"

      - name: Inspect immutable release status through constrained controller
        shell: bash
        run: |
          set -euo pipefail
          test -x /usr/local/sbin/qfj-phase15-release
          sudo -n /usr/local/sbin/qfj-phase15-release status

      - name: Inspect safe host observation metadata
        shell: bash
        run: |
          set -euo pipefail
          ROOT="/srv/qf-jarvis/state/observability"
          echo "OBSERVATION_ROOT readable=$([[ -r "$ROOT" ]] && echo true || echo false)"

          for file in aos-market-capacity.json aos-owner-attention.json whatsapp-worker.json agent-flow-trace.json; do
            path="$ROOT/$file"
            if [[ -f "$path" ]]; then
              if [[ -r "$path" ]]; then
                echo "FILE $file present readable=true size=$(stat -c '%s' "$path") mtime=$(stat -c '%y' "$path")"
              else
                echo "FILE $file present readable=false"
              fi
            else
              echo "FILE $file missing"
            fi
          done

          MARKET="$ROOT/aos-market-capacity.json"
          if [[ -r "$MARKET" ]]; then
            jq '{
              protocol,
              observedAt,
              sourceObservedAt,
              responseEvidence,
              cellsTotal,
              cellsTruncated,
              stateCounts,
              recommendationCounts,
              topCellsCount:(if (.topCells|type)=="array" then (.topCells|length) else 0 end)
            }' "$MARKET"
          fi

          ATTENTION="$ROOT/aos-owner-attention.json"
          if [[ -r "$ATTENTION" ]]; then
            jq '{
              protocol,
              observedAt,
              casesCount:(if (.cases|type)=="array" then (.cases|length) else 0 end),
              recommendationsCount:(if (.recommendations|type)=="array" then (.recommendations|length) else 0 end)
            }' "$ATTENTION"
          fi

          WORKER="$ROOT/whatsapp-worker.json"
          if [[ -r "$WORKER" ]]; then
            jq '{
              protocol,
              observedAt,
              revision,
              providerMode,
              status
            }' "$WORKER"
          fi
